version: 2

sources:
  - name: university_ch_raw
    database: university-chapters-poc
    schema: university_ch_raw
    tables:
      - name: chapters_raw
        description: >
          Source-aligned, append-only landing table populated by the
          ingestion Cloud Run Job. One row per ingestion run per chapter.
        config:
          loaded_at_field: ingestion_timestamp
        columns:
          - name: chapter_id
            description: Business key from the Ducks Unlimited API (ChapterID).
          - name: chapter_name
            description: University chapter name (University_Chapter).
          - name: city
            description: City.
          - name: state
            description: US state (CA, OR, WA in scope).
          - name: latitude
            description: Latitude (geometry.y from the source API).
          - name: longitude
            description: Longitude (geometry.x from the source API).
          - name: source_object_id
            description: ArcGIS OBJECTID from the source feature.
          - name: ingestion_timestamp
            description: UTC timestamp when this row was ingested.
          - name: ingestion_date
            description: Partition column - date portion of ingestion_timestamp.
          - name: run_id
            description: UUID of the ingestion run that produced this row.